services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: freedomsword-backend:local
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: "3001"
    expose:
      - "3001"

  outbox:
    image: freedomsword-backend:local
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
    command: ["node", "dist/outbox-worker.js"]
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.backend:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
