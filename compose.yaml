services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: democracy
      POSTGRES_PASSWORD: democracy
      POSTGRES_DB: democracy
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - democracy-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U democracy"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  democracy-data:
